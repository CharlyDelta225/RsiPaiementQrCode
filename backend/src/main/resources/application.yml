spring:
  application:
    name: offering
  datasource:
    # Base H2 enregistrée dans backend/data/ : les données survivent aux redémarrages.
    # AUTO_SERVER autorise un second accès simultané (console H2, outil SQL).
    url: ${DB_URL:jdbc:h2:file:./data/offeringdb;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

server:
  # PORT est fourni par l'hébergeur (Render, Railway…).
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:ChangerMoi-ClefSecreteJWT-HS256-256bits-Minimum-0123456789abcd}
  expiration: 2h

app:
  seed:
    # Comptes de démonstration (admin@rsi.local…) : développement uniquement, coupé en prod.
    demo-users: true
  payment:
    # Paiement simulé (pas de débit réel) : pratique en développement, à couper en production
    # tant que l'agrégateur n'est pas branché (PAYMENT_SIMULATION_ENABLED=false).
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:true}
  rate-limit:
    # POST par IP et par minute (anti-spam). Seuils larges : sur mobile, beaucoup de fidèles
    # partagent la même IP opérateur, surtout pendant le culte.
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: 20
    register-per-minute: 10
    public-per-minute: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  qr:
    donation-url: ${QR_DONATION_URL:http://localhost:4200/don}
    # Ouvert depuis le QR « installer sur mobile » affiché aux utilisateurs connectés sur ordinateur.
    app-url: ${QR_APP_URL:http://localhost:4200/login}
    size: ${QR_SIZE:600}