spring:
  application:
    name: offering
  datasource:
    url: jdbc:h2:mem:offeringdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ChangerMoi-ClefSecreteJWT-HS256-256bits-Minimum-0123456789abcd}
  expiration: 2h

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  qr:
    donation-url: ${QR_DONATION_URL:http://localhost:4200/don}
    size: ${QR_SIZE:600}