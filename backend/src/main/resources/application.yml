spring:
  application:
    name: offering
  datasource:
    url: jdbc:h2:mem:offeringdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true

server:
  port: 8080