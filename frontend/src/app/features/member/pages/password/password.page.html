<div class="member-page">
  <header class="member-page__header">
    <div class="member-page__header-inner">
      <a class="member-page__back" routerLink="/member/settings" aria-label="Retour aux réglages">
        <app-icon name="arrow-back" [size]="20" />
      </a>
      <div>
        <h1 class="member-page__title">Mot de passe</h1>
        <p class="member-page__subtitle">Choisissez un mot de passe d’au moins 8 caractères</p>
      </div>
    </div>
  </header>

  <main class="member-page__body">
    <section class="member-card" aria-label="Changer le mot de passe">
      <form class="password-form" [formGroup]="form" (ngSubmit)="save()" novalidate>
        <app-password-input
          label="Mot de passe actuel"
          placeholder="Votre mot de passe actuel"
          autocomplete="current-password"
          [control]="form.controls.currentPassword"
        />
        <app-password-input
          label="Nouveau mot de passe"
          placeholder="8 caractères minimum"
          autocomplete="new-password"
          minLengthMessage="Le mot de passe doit contenir au moins 8 caractères."
          [control]="form.controls.newPassword"
        />
        <div class="password-field">
          <app-password-input
            label="Confirmer le nouveau mot de passe"
            placeholder="Retapez le nouveau mot de passe"
            autocomplete="new-password"
            requiredMessage="Veuillez confirmer le nouveau mot de passe."
            [control]="form.controls.confirmPassword"
          />
          @if (form.hasError('mismatch') && form.controls.confirmPassword.touched) {
            <p class="password-field__error" role="alert">Les mots de passe ne correspondent pas.</p>
          }
        </div>
        @if (error(); as text) {
          <div class="member-page__error" role="alert"><p>{{ text }}</p></div>
        }
        @if (message(); as text) {
          <p class="member-page__success" role="status">{{ text }}</p>
        }
        <app-primary-button type="submit" [loading]="saving()">
          Mettre à jour le mot de passe
        </app-primary-button>
      </form>
    </section>
  </main>
</div>
