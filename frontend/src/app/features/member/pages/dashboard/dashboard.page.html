<div class="dashboard">
  <div class="dashboard__shell">
    <header class="dashboard__header">
      <div class="dashboard__header-inner">
        <div class="dashboard__greeting">
          <p class="dashboard__hello">Bonjour, {{ getFirstName() }} 👋</p>
          <p class="dashboard__subtext">Que Dieu bénisse votre générosité !</p>
        </div>
        <div class="dashboard__header-actions">
          <a class="dashboard__icon-btn" routerLink="/member/settings" aria-label="Réglages">
            <app-icon name="settings" [size]="22" />
          </a>
          <app-notification-button />
        </div>
      </div>
    </header>

    <main class="dashboard__body">
      <section class="dashboard__balance" aria-label="Mes dons de l’année">
        <app-balance-card [label]="'Mes dons en ' + currentYear" [amount]="yearTotal()" />
      </section>

      <app-install-banner />

      <section class="dashboard__actions" aria-label="Actions rapides">
        <div class="dashboard__quick-actions">
          <app-quick-action
            icon="donate"
            label="Faire une contribution"
            route="/member/contribution"
          />
          <app-quick-action
            icon="history"
            label="Mon historique"
            route="/member/contributions"
          />
          <app-quick-action
            icon="person"
            label="Mon profil"
            route="/member/settings/profile"
          />
        </div>
      </section>

      <section class="dashboard__verse" aria-label="Verset du jour">
        <app-bible-verse-card />
      </section>

      <section class="dashboard__recent" aria-label="Contributions récentes">
        <div class="dashboard__section-head">
          <h2 class="dashboard__section-title">Mes contributions récentes</h2>
          <a class="dashboard__see-all" routerLink="/member/contributions">
            Voir tout
          </a>
        </div>

        <div class="dashboard__list">
          @if (loading()) {
            <p class="dashboard__empty">Chargement…</p>
          } @else if (contributions().length === 0) {
            <p class="dashboard__empty">Aucune contribution pour le moment.</p>
          } @else {
            @for (item of contributions(); track item.id) {
              <a class="dashboard__item-link" [routerLink]="['/member/contributions', item.id]">
                <app-contribution-item [contribution]="item" />
              </a>
            }
          }
        </div>
      </section>
    </main>
  </div>
</div>
